<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f2027;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a6f;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a6f;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb700;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="white" stroke-width="1"/>
  </g>

  <!-- Left side: Text content -->
  <text x="80" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">BenchMarked</text>
  <rect x="80" y="138" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0c4e8" font-weight="400">Intelligent Job Offer Analysis</text>

  <!-- Feature pills -->
  <rect x="80" y="220" width="130" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
  <text x="145" y="241" font-family="system-ui, sans-serif" font-size="13" fill="#00d2ff" text-anchor="middle" font-weight="500">AI-Powered</text>

  <rect x="225" y="220" width="150" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
  <text x="300" y="241" font-family="system-ui, sans-serif" font-size="13" fill="#00d2ff" text-anchor="middle" font-weight="500">Market Data</text>

  <rect x="390" y="220" width="140" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
  <text x="460" y="241" font-family="system-ui, sans-serif" font-size="13" fill="#00d2ff" text-anchor="middle" font-weight="500">COL Adjusted</text>

  <!-- Subtitle -->
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="16" fill="#7a9ec2">Compare compensation, growth, and work-life balance</text>
  <text x="80" y="325" font-family="system-ui, sans-serif" font-size="16" fill="#7a9ec2">across multiple offers with AI recommendations.</text>

  <!-- Built with badge -->
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="13" fill="#5a7a9a">Built with PocketFlow + Gemini</text>

  <!-- Right side: Comparison visualization -->

  <!-- Offer Card 1 (winner) -->
  <rect x="660" y="50" width="240" height="155" rx="12" fill="url(#card1)" stroke="#3a7bd5" stroke-width="1.5"/>
  <circle cx="685" cy="78" r="10" fill="url(#star)"/>
  <text x="700" y="83" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="600">Company A</text>
  <text x="860" y="83" font-family="system-ui, sans-serif" font-size="13" fill="#4facfe" font-weight="600" text-anchor="end">9.2/10</text>

  <!-- Bars for Card 1 -->
  <text x="680" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#7a9ec2">Compensation</text>
  <rect x="680" y="117" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="117" width="180" height="6" rx="3" fill="url(#bar1)"/>

  <text x="680" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#7a9ec2">Growth</text>
  <rect x="680" y="145" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="145" width="170" height="6" rx="3" fill="url(#bar3)"/>

  <text x="680" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#7a9ec2">Work-Life Balance</text>
  <rect x="680" y="173" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="173" width="155" height="6" rx="3" fill="url(#bar1)"/>

  <!-- Offer Card 2 -->
  <rect x="660" y="225" width="240" height="155" rx="12" fill="url(#card2)" stroke="#5a7a9a" stroke-width="1"/>
  <circle cx="685" cy="253" r="10" fill="#5a7a9a"/>
  <text x="700" y="258" font-family="system-ui, sans-serif" font-size="14" fill="#c0d8ee" font-weight="500">Company B</text>
  <text x="860" y="258" font-family="system-ui, sans-serif" font-size="13" fill="#a0c4e8" font-weight="500" text-anchor="end">8.1/10</text>

  <!-- Bars for Card 2 -->
  <text x="680" y="287" font-family="system-ui, sans-serif" font-size="11" fill="#5a7a9a">Compensation</text>
  <rect x="680" y="292" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="292" width="150" height="6" rx="3" fill="url(#bar2)"/>

  <text x="680" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#5a7a9a">Growth</text>
  <rect x="680" y="320" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="320" width="190" height="6" rx="3" fill="url(#bar2)"/>

  <text x="680" y="343" font-family="system-ui, sans-serif" font-size="11" fill="#5a7a9a">Work-Life Balance</text>
  <rect x="680" y="348" width="200" height="6" rx="3" fill="#1a2d42"/>
  <rect x="680" y="348" width="130" height="6" rx="3" fill="url(#bar2)"/>

  <!-- Radar chart hint (right side) -->
  <g transform="translate(1010, 200)">
    <!-- Pentagon radar shape -->
    <polygon points="0,-70 66,-22 41,57 -41,57 -66,-22" fill="none" stroke="#2d4a6f" stroke-width="1"/>
    <polygon points="0,-45 43,-14 26,37 -26,37 -43,-14" fill="none" stroke="#2d4a6f" stroke-width="1"/>
    <polygon points="0,-20 19,-6 12,16 -12,16 -19,-6" fill="none" stroke="#2d4a6f" stroke-width="1"/>
    <!-- Data polygon -->
    <polygon points="0,-60 55,-15 30,50 -35,45 -50,-10" fill="#3a7bd5" fill-opacity="0.25" stroke="#3a7bd5" stroke-width="1.5"/>
    <polygon points="0,-40 45,-5 20,40 -25,30 -55,-15" fill="#f5576c" fill-opacity="0.15" stroke="#f5576c" stroke-width="1.5"/>
    <!-- Dots -->
    <circle cx="0" cy="-60" r="3" fill="#3a7bd5"/>
    <circle cx="55" cy="-15" r="3" fill="#3a7bd5"/>
    <circle cx="30" cy="50" r="3" fill="#3a7bd5"/>
    <circle cx="-35" cy="45" r="3" fill="#3a7bd5"/>
    <circle cx="-50" cy="-10" r="3" fill="#3a7bd5"/>
    <!-- Labels -->
    <text x="0" y="-80" font-family="system-ui, sans-serif" font-size="10" fill="#7a9ec2" text-anchor="middle">Comp</text>
    <text x="80" y="-18" font-family="system-ui, sans-serif" font-size="10" fill="#7a9ec2" text-anchor="middle">Growth</text>
    <text x="55" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#7a9ec2" text-anchor="middle">WLB</text>
    <text x="-55" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#7a9ec2" text-anchor="middle">Culture</text>
    <text x="-80" y="-18" font-family="system-ui, sans-serif" font-size="10" fill="#7a9ec2" text-anchor="middle">Benefits</text>
  </g>
</svg>
